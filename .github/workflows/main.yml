          unzip -q -o gradle.zip
          if ! ./gradle-8.4/bin/gradle assembleRelease assembleDebug --no-daemon --max-workers=2 --stacktrace 2>&1 | tee build.log; then
            echo "### Build Error Log" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            grep -E "(^e: |FAILURE:|What went wrong|AAPT:)" -A 8 build.log >> "$GITHUB_STEP_SUMMARY" || tail -n 40 build.log >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p app/build/outputs/apk/debug
          cp -f app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/DinkScore-v5.1.apk

      - name: Upload Ready-to-Install Watch & Phone APK (v5.1)
        uses: actions/upload-artifact@v4
        with:
          name: DinkScore-v5.1-APK
          path: app/build/outputs/apk/debug/DinkScore-v5.1.apk
